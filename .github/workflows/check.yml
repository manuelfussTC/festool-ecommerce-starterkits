name: Starter und Referenzen prüfen
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - starters/produktdaten-check
          - starters/produktvergleich
          - starters/shop-reporting
          - starters/spielstart
          - referenzen/produktdaten-check
          - referenzen/produktvergleich
          - referenzen/shop-reporting
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --no-fund
      - run: npm test
      - run: npm run build
      - if: startsWith(matrix.project, 'referenzen/')
        run: npm run test:ziel
